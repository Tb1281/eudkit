[package]
name = "eudkit-opt"
version.workspace = true
edition = "2024"

[features]
# Test-only instrumentation: expose process-wide call counters so the compile
# pipeline can prove `optimize_module` / `analyze_storage` run once per build.
# Off in production builds.
count-calls = []

[dependencies]
eudkit-hir = { path = "../eudkit-hir" }
eudkit-lir = { path = "../eudkit-lir" }
