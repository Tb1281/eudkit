[package]
name = "eudkit"
version.workspace = true
edition = "2024"

[dependencies]
eudkit-hir = { path = "../eudkit-hir" }
eudkit-opt = { path = "../eudkit-opt" }
eudkit-lower = { path = "../eudkit-lower" }
eudkit-lir = { path = "../eudkit-lir" }
eudkit-map = { path = "../eudkit-map" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
stormlib.workspace = true
