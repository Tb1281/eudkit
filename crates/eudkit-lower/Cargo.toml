[package]
name = "eudkit-lower"
version.workspace = true
edition = "2024"

[dependencies]
eudkit-hir = { path = "../eudkit-hir" }
eudkit-opt = { path = "../eudkit-opt" }
eudkit-lir = { path = "../eudkit-lir" }
eudkit-map = { path = "../eudkit-map" }
stormlib.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# Enables the test-only call counters in eudkit-opt (`OPTIMIZE_MODULE_CALLS`,
# `ANALYZE_STORAGE_CALLS`) so the C2c test can prove one pair per compile.
eudkit-opt = { path = "../eudkit-opt", features = ["count-calls"] }
